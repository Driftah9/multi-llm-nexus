name: Installer Validation

on:
  push:
    branches: [main, convergence-port-*]
    paths:
      - "install.sh"
      - "setup.sh"
      - "scripts/**"
      - ".github/workflows/install-test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Note: Full end-to-end installer testing requires real Ubuntu VMs with TTY
# (whiptail, sudo prompts, bash read). These jobs validate syntax & structure only.
# For full testing, use: make test-installer-local (or local VM testing)

jobs:
  preflight:
    name: Preflight Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run preflight checks
        run: bash scripts/preflight_check.sh
        continue-on-error: true  # Warnings are OK

  syntax-check:
    name: Syntax & Script Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax (install.sh, setup.sh, preflight_check.sh)
        run: |
          bash -n install.sh && echo "✓ install.sh syntax OK"
          bash -n setup.sh && echo "✓ setup.sh syntax OK"
          bash -n scripts/preflight_check.sh && echo "✓ preflight_check.sh syntax OK"

      - name: Check Python syntax (install_state.py)
        run: |
          python3 -m py_compile scripts/install_state.py && echo "✓ install_state.py syntax OK"

      - name: Verify critical files exist
        run: |
          [[ -f install.sh ]] && echo "✓ install.sh exists"
          [[ -f setup.sh ]] && echo "✓ setup.sh exists"
          [[ -f scripts/preflight_check.sh ]] && echo "✓ preflight_check.sh exists"
          [[ -f scripts/install_state.py ]] && echo "✓ install_state.py exists"
          [[ -f docs/INSTALLER_RESILIENCE.md ]] && echo "✓ INSTALLER_RESILIENCE.md exists"

  state-tracker:
    name: Install State Tracker Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test mark-phase
        run: |
          python3 scripts/install_state.py mark-phase test-phase-1
          python3 scripts/install_state.py mark-phase test-phase-2

      - name: Test is-completed
        run: |
          python3 scripts/install_state.py is-completed test-phase-1 && echo "✓ Phase found"
          python3 scripts/install_state.py is-completed nonexistent && exit 1 || echo "✓ Phase not found (expected)"

      - name: Test show
        run: |
          python3 scripts/install_state.py show

      - name: Test reset
        run: |
          python3 scripts/install_state.py reset
          python3 scripts/install_state.py is-completed test-phase-1 && exit 1 || echo "✓ State reset confirmed"
