    docs:
      - "KNOWN_LIMITATIONS.md"
      - "CHANGELOG.md"
      - ".github/ISSUE_TEMPLATE/bug_report.yml"
    claim: "nexus doctor renders state as a string/file. NO phone-home. Keys reported present/absent only."

  - area: "Nexus Mesh (concept)"
    paths:
