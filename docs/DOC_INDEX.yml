  - area: "secrets lint (design rule #4)"
    paths:
      - "scripts/secrets_lint.py"
      - "config/secrets-lint-allow.txt"
    docs:
      - "docs/LIVE_CONVERGENCE_2026-10.md"
    claim: "Scans git-tracked files; prints file:line:kind only, never the value; every allowlist entry carries a reason."
