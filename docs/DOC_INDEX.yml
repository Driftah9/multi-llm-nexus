# DOC_INDEX — the anti-drift claim map.
#
# Maps a code/config area → the docs that make CLAIMS about it, plus the current
# claim that must stay true. `scripts/doc_check.py` reads this: when you change a file
# matching a `paths:` glob, it lists that area's docs so you reconcile them BEFORE editing.
#
# Why a map on top of grep: grep catches docs that NAME the changed file; this catches
# docs that make a CONCEPTUAL claim ("self-improvement loop", "routes around busy pools")
# without naming the module. Both are needed.
#
# MAINTENANCE: when you add a doc that describes a subsystem, or change what a subsystem
# does, update the matching entry here in the SAME change. Keep `claim` short — it's the
# one-line truth a reviewer checks the doc against.
#
# Last verified against code: 2026-07-26
# # NEXUS:PORTABLE (the schema) / # NEXUS:OPERATOR (the specific paths+docs below)

subsystems:
  - area: "provider routing / tier pools / failover"
    paths:
      - "src/core/pool_router.py"
      - "src/core/pool_manager.py"
      - "src/core/bridge.py"
      - "src/core/chain_builder.py"
      - "src/core/provider_chain.py"
    docs:
      - "docs/POOL_ROUTING_REFACTOR.md"
      - "docs/gpu-pool-topology.md"
      - "docs/provider-integration-roadmap.md"
      - "docs/BUILDOUT_STATUS.md"
      - "README.md"
      - "KNOWN_LIMITATIONS.md"
    claim: "Provider-level PARALLEL fan-out is NOT wired (parallelism parsed, never branched). Busy-pool routing only feeds the legacy ProviderChain path, not the tier_pools path."

  - area: "flight recorder / turn journal (crash forensics)"
    paths:
      - "src/core/flight_recorder.py"
      - "scripts/flight_recover.py"
    docs:
      - "README.md"
      - "docs/BUILDOUT_STATUS.md"
    claim: "Real, wired into ProviderChain.try_with_fallback (turn_start/attempt_start/attempt_end/turn_end; recording only, zero chain-behavior change). Fail-open — a recorder error never breaks a turn. Daily UTC JSONL under the layout-resolved Logs/flight_recorder/ dir (FLIGHT_RECORDER_DIR override), pruned by FLIGHT_RECORDER_RETENTION_DAYS (default 14). Chunk-level partial-output events are supported by the module's API but not emitted by try_with_fallback, since its invoke_fn is a single-shot call with no partial-chunk callback — only callers with a streaming/partial hook (e.g. a future bridge.py wiring) would emit chunk events."

  - area: "memory recall / injection"
    paths:
      - "src/core/memory_injector.py"
      - "src/core/rag_store.py"
      - "src/core/memory_loader.py"
    docs:
      - "docs/convergence-2026-06.md"
      - "docs/BUILDOUT_STATUS.md"
      - "README.md"
    claim: "Recall is trivial-query gated (acks/short queries skip retrieval entirely), score-carrying (RecallHit.score = similarity via RagStore.query_scored; 0.0 on unscored custom stores), and variable-k — an empty recall block is correct behavior, hits are never padded to k."

  - area: "quota / rate governance"
    paths:
      - "src/core/provider_quota.py"
    docs:
      - "docs/BUILDOUT_STATUS.md"
      - "docs/provider-integration-roadmap.md"
      - "docs/gpu-pool-topology.md"
    claim: "provider_quota.py + pool_manager ProviderRateState are the real rate/quota layer (the proposed rate_limiter.py / routing_rules.yaml were never built)."

  - area: "triage / classification"
    paths:
      - "src/core/triage.py"
      - "src/core/triage_validator.py"
    docs:
      - "docs/BUILDOUT_STATUS.md"
      - "docs/local_llm_guide.md"
      - "README.md"
    claim: "5-dimension triage (urgency, task_value, capability, complexity, task_type). Runs on every message."

  - area: "capability ladder / swarm / council"
    paths:
      - "src/orchestration/*"
    docs:
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "KNOWN_LIMITATIONS.md"
      - "PHILOSOPHY.md"
      - "docs/BUILDOUT_STATUS.md"
      - "docs/convergence-2026-06.md"
      - "docs/SYSTEM_DESIGN.md"
    claim: "Swarm/ladder/council are ported + tested but INERT behind SWARM_LOOP_ENABLED=0 (not battle-tested). The built council is fixed-role (Skeptic/Advocate/Verifier), NOT the reputation-scoring council in SYSTEM_DESIGN §6."

  - area: "multi-orchestrator failover (leader election)"
    paths:
      - "src/core/council_lease.py"
      - "src/core/council_resumer.py"
      - "src/core/council_checkpoint.py"
    docs:
      - "docs/convergence-2026-06.md"
      - "docs/SYSTEM_DESIGN.md"
    claim: "Standalone modules + capability-gate example + diagnostic only — NOT wired into the live dispatch loop. Distinct from the fixed-role council (name collision)."

  - area: "providers registry / provider modules"
    paths:
      - "src/providers/*"
    docs:
      - "docs/AI_PROVIDER_REFERENCE.md"
      - "docs/api-key-setup-guide.md"
      - "docs/provider-integration-roadmap.md"
      - "README.md"
      - "AGENTS.md"
    claim: "registry.py is the installer's source of truth (NOT the reference doc). Canonical count: 8 provider-type adapters fronting 22 selectable providers (100+ models)."

  - area: "heartbeat / live status display"
    paths:
      - "src/core/heartbeat.py"
    docs:
      - "README.md"
      - "AGENTS.md"
    claim: "Real. Mechanical (zero LLM tokens). Adapter-agnostic push_fn."

  - area: "self-improvement / evolution loop"
    paths:
      - "src/core/skill_metrics.py"
    docs:
      - "README.md"
      - "PHILOSOPHY.md"
      - "docs/lineage.md"
      - "docs/comparison.md"
      - "KNOWN_LIMITATIONS.md"
    claim: "DESIGNED, NOT BUILT. skill_metrics.py logs to SQLite; no candidate-queue / report-generator / bi-weekly loop exists. Never describe it as working."

  - area: "installer / setup / wizard"
    paths:
      - "src/setup/*"
      - "scripts/preflight_check.sh"
      - "scripts/install_state.py"
      - "install.sh"
    docs:
      - "docs/INSTALLER_RESILIENCE.md"
      - "docs/local_llm_guide.md"
      - "README.md"
      - "CONTRIBUTING.md"
    claim: "Wizard recommends local models via hardware_detect.py's VRAM/vendor-tiered logic (NVIDIA/AMD/Intel GPU VRAM tiers → model + provider + notes; CPU-only falls back to RAM tiers) — wired into wizard.py's hardware_detection() as of 2026-08-11 (previously recomputed a RAM-only/GPU-presence-only duplicate that ignored VRAM). An optional llmfit cross-check (PROTOTYPE, phase 1 compare-only) prints alongside it but never overrides it. Note: for AMD/Intel GPUs hardware_detect.py may recommend provider vllm, but provider_selection()'s checklist still only pre-selects ollama — a known follow-up gap. preflight_check.sh + install_state.py are standalone — NOT yet invoked by install.sh. No CI. install.sh installs the FULL requirements.txt (canonical dep list — every provider SDK + adapter dep, so no selection hits ModuleNotFoundError) and installs Docker unconditionally via get.docker.com (container tools ready on demand); the nexus user is added to the docker group. requirements.txt is canonical; pyproject extras reconciled to google-genai (was the deprecated google-generativeai that broke gemini.py)."

  - area: "install directory layout / file governance"
    paths:
      - "config/directory_layout.json"
      - "install.sh"
      - "src/core/layout.py"
    docs:
      - "docs/DIRECTORY_LAYOUT.md"
      - "KNOWN_LIMITATIONS.md"
    claim: "config/directory_layout.json is the SINGLE source of truth for the install layout; install.sh reads class:'scaffold' folders from it (stdlib JSON, pre-venv) with a built-in fallback, and the engine resolves locations via src/core/layout.py (fails loud on undeclared names). DIRECTORY_LAYOUT.md is its human face and must stay reconciled. Adding a dir = one manifest entry. Case/naming still diverges from the lowercase live canon (convergence gap, tracked in KNOWN_LIMITATIONS)."

  - area: "config schema"
    paths:
      - "src/core/config_schema.py"
      - "config/*.example"
    docs:
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/AI_PROVIDER_REFERENCE.md"
      - "docs/api-key-setup-guide.md"
    claim: "providers.yaml/adapters.yaml validated at boot; exits on invalid. Current model is tier_pools:/cost_class/role: (the bare enabled: true flip is legacy mode)."

  - area: "adapters (Mattermost/Discord/Telegram/API)"
    paths:
      - "src/adapters/*"
    docs:
      - "README.md"
      - "AGENTS.md"
      - "docs/api-key-setup-guide.md"
    claim: "Mattermost/Discord/Telegram implemented (Beta). Slack/Matrix are config-reserved, no code. OpenAI-compatible API adapter default port 8080."

  - area: "self-diagnostic report"
    paths:
