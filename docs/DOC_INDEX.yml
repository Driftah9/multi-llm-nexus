      - "docs/BUILDOUT_STATUS.md"
    claim: "The chain records every attempt; routing_weights is DEMOTE-ONLY (>=8 recent samples AND weight<0.35 or p50>12s), never drops a provider, identity with no evidence or ROUTING_WEIGHTS_ENABLED=0."

  - area: "turn-failure surfacing / adapter reply path"
    paths:
      - "src/core/turn_failure.py"
      - "src/adapters/adapter_base.py"
    docs:
      - "docs/LIVE_CONVERGENCE_2026-10.md"
    claim: "A crash in pre-dispatch, dispatch or output replaces the placeholder with a visible error and records it in $NEXUS_DATA_DIR/error-inbox/open/ (read by nightly_sweeper); no stage leaves the placeholder hanging."

