    claim: "CONCEPT — not built, not in active development. No src/mesh/ exists. If a src/mesh/ ever appears, that itself is a major status change requiring all mesh docs to flip from 'concept' to real."

  - area: "hardware tiers (Citadel / server / phone cluster)"
    paths:
      - "config/pools.yaml.example"
      - "src/setup/hardware_detect.py"
    docs:
      - "docs/citadel-tier.md"
      - "docs/server-grade-builds.md"
      - "docs/gpu-pool-topology.md"
      - "docs/phone-llm-cluster.md"
      - "KNOWN_LIMITATIONS.md"
    claim: "Documented hardware DESIGNS, not validated deployments. Test matrix does not include multi-GPU NVLink or phone clusters."

  - area: "workspace guard / agent loop guard (office model)"
    paths:
      - "src/core/workspace_guard.py"
      - "scripts/workspace_guard_hook.py"
      - "src/core/agent_loop.py"
    docs:
      - "docs/WORKSPACE_GUARD.md"
      - "docs/BUILDOUT_STATUS.md"
      - "AGENTS.md"
    claim: "Destructive ops only. Linked context = top-level project folder (nested = sub-rooms); root + scaffolding entries need confirm; other projects blocked from a linked context; reads never blocked. guard_fn runs on every call, fail-closed."

  - area: "provider recovery / outage reasons"
    paths:
      - "src/core/outage_reason.py"
      - "src/core/provider_chain.py"
    docs:
      - "docs/LIVE_CONVERGENCE_2026-10.md"
      - "docs/BUILDOUT_STATUS.md"
    claim: "HealthMonitor decides recovery by failure class (quota waits, transient probes, auth/bad_request/model_gone need a human); recovery clears the bench and calls the injected on_recovery; no second health store."

